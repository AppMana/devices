[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "device-dimensions"
version = "0.1.0"
description = "Apple device drawing measurements, native resolutions and hardware identifiers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AppMana"}]

[project.urls]
Repository = "https://github.com/appmana/devices"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
device_dimensions = ["devices.json", "py.typed"]
